<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Daily Protocol | Tula OS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dark: '#020617',
                        accent: '#22d3ee', /* Cyan */
                        success: '#10b981', /* Emerald */
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'], /* Font code cho ngầu */
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #020617; color: #f8fafc; font-family: 'Inter', sans-serif; }
        
        /* Custom Checkbox Design */
        .task-checkbox { display: none; }
        .task-label {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        .task-label:hover { background: rgba(34, 211, 238, 0.05); border-color: rgba(34, 211, 238, 0.3); }
        
        /* Trạng thái đã tích */
        .task-checkbox:checked + .task-label {
            background: rgba(34, 211, 238, 0.1);
            border-color: #22d3ee;
            box-shadow: 0 0 15px rgba(34, 211, 238, 0.2);
        }
        .task-checkbox:checked + .task-label .task-text {
            color: #22d3ee;
            text-decoration: line-through;
            opacity: 0.7;
        }
        
        /* Custom Box Icon */
        .check-box {
            width: 20px;
            height: 20px;
            border: 2px solid #64748b;
            border-radius: 4px;
            margin-right: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }
        .task-checkbox:checked + .task-label .check-box {
            background: #22d3ee;
            border-color: #22d3ee;
        }
        .check-icon { display: none; color: #020617; font-weight: bold; font-size: 14px; }
        .task-checkbox:checked + .task-label .check-box .check-icon { display: block; }

        /* Progress Bar */
        .progress-container {
            width: 100%;
            height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 99px;
            margin-top: 20px;
            overflow: hidden;
        }
        .progress-bar {
            height: 100%;
            background: #22d3ee;
            width: 0%;
            transition: width 0.5s ease;
            box-shadow: 0 0 10px #22d3ee;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">

    <div class="max-w-md w-full">
        
        <div class="mb-8 flex justify-between items-end">
            <div>
                <h1 class="text-3xl font-bold text-white tracking-tight font-mono">DAILY_PROTOCOL</h1>
                <p class="text-xs text-slate-400 mt-1 uppercase tracking-widest" id="current-date">Fetching Date...</p>
            </div>
            <div class="text-right">
                <span class="text-2xl font-bold text-accent" id="completion-rate">0%</span>
                <p class="text-[10px] text-slate-500 uppercase">System Integrity</p>
            </div>
        </div>

        <div class="progress-container mb-8">
            <div class="progress-bar" id="main-progress"></div>
        </div>

        <div class="space-y-3 mb-10" id="checklist-container">
            </div>

        <div class="border-t border-white/10 pt-8">
            <h2 class="text-sm font-bold text-white mb-4 flex items-center gap-2">
                <svg class="w-4 h-4 text-accent" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                DAILY REFLECTION
            </h2>
            
            <textarea id="journal-input" class="w-full h-32 bg-slate-900/50 border border-white/10 rounded-xl p-4 text-sm text-slate-300 focus:outline-none focus:border-accent/50 focus:ring-1 focus:ring-accent/50 transition-all resize-none font-mono leading-relaxed" placeholder="1. Hôm nay làm tốt gì?&#10;2. Cải thiện gì?&#10;3. Mai làm gì quan trọng nhất?"></textarea>
            
            <div class="flex justify-between items-center mt-3">
                <span class="text-[10px] text-slate-500" id="save-status">Auto-saved to Local Storage</span>
                <button onclick="clearData()" class="text-[10px] text-red-500/50 hover:text-red-500 transition-colors uppercase tracking-wider">Reset Day</button>
            </div>
        </div>

    </div>

    <script>
        // 1. Cấu hình danh sách thói quen
        const habits = [
            { id: 'h1', text: '2h Deep Work (No Phone)' },
            { id: 'h2', text: 'Gym / Vận động' },
            { id: 'h3', text: 'Uống đủ nước (2L)' },
            { id: 'h4', text: 'Học kiến thức mới (Bắt buộc)' },
            { id: 'h5', text: 'English Shadowing 10’' },
            { id: 'h6', text: 'Reading Habit 10’' },
            { id: 'h7', text: 'Facial Exercise' },
            { id: 'h8', text: 'Tắt máy 45p trước ngủ' },
            { id: 'h9', text: 'Self-Reflection (Viết dưới)' },
        ];

        // 2. Render Checklist ra HTML
        const container = document.getElementById('checklist-container');
        habits.forEach(habit => {
            const html = `
                <div>
                    <input type="checkbox" id="${habit.id}" class="task-checkbox" onchange="updateProgress()">
                    <label for="${habit.id}" class="task-label">
                        <div class="check-box">
                            <span class="check-icon">✓</span>
                        </div>
                        <span class="task-text text-sm text-slate-300 font-medium">${habit.text}</span>
                    </label>
                </div>
            `;
            container.insertAdjacentHTML('beforeend', html);
        });

        // 3. Xử lý Logic (LocalStorage)
        const journalInput = document.getElementById('journal-input');
        const dateDisplay = document.getElementById('current-date');
        
        // Lấy ngày hiện tại format YYYY-MM-DD
        const getToday = () => new Date().toISOString().split('T')[0];

        function loadData() {
            // Hiển thị ngày
            const today = new Date();
            dateDisplay.innerText = today.toLocaleDateString('vi-VN', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

            const savedDate = localStorage.getItem('tula_date');
            const currentDay = getToday();

            // Nếu qua ngày mới -> Reset
            if (savedDate !== currentDay) {
                localStorage.clear(); // Xóa sạch dữ liệu cũ
                localStorage.setItem('tula_date', currentDay);
            } else {
                // Nếu vẫn là hôm nay -> Load lại trạng thái
                habits.forEach(h => {
                    const isChecked = localStorage.getItem(h.id) === 'true';
                    document.getElementById(h.id).checked = isChecked;
                });
                journalInput.value = localStorage.getItem('tula_journal') || '';
            }
            updateProgress();
        }

        function updateProgress() {
            // Tính toán %
            const total = habits.length;
            const checked = document.querySelectorAll('.task-checkbox:checked').length;
            const percent = Math.round((checked / total) * 100);

            // Update UI
            document.getElementById('completion-rate').innerText = `${percent}%`;
            document.getElementById('main-progress').style.width = `${percent}%`;

            // Lưu trạng thái Checkbox
            habits.forEach(h => {
                const isChecked = document.getElementById(h.id).checked;
                localStorage.setItem(h.id, isChecked);
            });
        }

        // Lưu Journal khi gõ (Auto-save)
        journalInput.addEventListener('input', () => {
            localStorage.setItem('tula_journal', journalInput.value);
            document.getElementById('save-status').innerText = "Saving...";
            setTimeout(() => {
                document.getElementById('save-status').innerText = "Saved";
            }, 1000);
        });

        function clearData() {
            if(confirm("Start a new day?")) {
                localStorage.clear();
                location.reload();
            }
        }

        // Chạy khi mở web
        loadData();

    </script>
</body>
</html>

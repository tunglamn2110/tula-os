<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Protocol | Tula OS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dark: '#020617',
                        accent: '#22d3ee', /* Cyan */
                        success: '#10b981', /* Emerald */
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #020617; color: #f8fafc; font-family: 'Inter', sans-serif; }
        
        /* Custom Checkbox Design */
        .task-checkbox { display: none; }
        .task-label {
            display: flex;
            align-items: center;
            padding: 10px 14px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
        }
        .task-label:hover { background: rgba(255, 255, 255, 0.05); }
        
        /* Trạng thái đã tích */
        .task-checkbox:checked + .task-label {
            background: rgba(34, 211, 238, 0.08);
            border-color: rgba(34, 211, 238, 0.5);
        }
        .task-checkbox:checked + .task-label .task-text {
            color: #94a3b8;
            text-decoration: line-through;
        }
        
        /* Custom Box Icon */
        .check-box {
            width: 18px;
            height: 18px;
            border: 1.5px solid #64748b;
            border-radius: 4px;
            margin-right: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
        }
        .task-checkbox:checked + .task-label .check-box {
            background: #22d3ee;
            border-color: #22d3ee;
        }
        .check-icon { display: none; color: #020617; font-weight: bold; font-size: 12px; }
        .task-checkbox:checked + .task-label .check-box .check-icon { display: block; }

        /* Progress Bar */
        .progress-container {
            width: 100%;
            height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 99px;
            position: sticky;
            top: 0;
            z-index: 50;
        }
        .progress-bar {
            height: 100%;
            background: #22d3ee;
            width: 0%;
            transition: width 0.5s ease;
            box-shadow: 0 0 10px #22d3ee;
        }
    </style>
</head>
<body class="min-h-screen flex justify-center py-10 px-4">

    <div class="max-w-lg w-full">
        
        <a href="index.html" class="inline-flex items-center gap-2 text-slate-500 hover:text-white transition-colors mb-6 text-xs uppercase tracking-widest">
            <span>←</span> Return to OS
        </a>

        <div class="mb-6 flex justify-between items-end">
            <div>
                <h1 class="text-2xl font-bold text-white tracking-tight font-mono">DAILY_PROTOCOL</h1>
                <p class="text-xs text-slate-400 mt-1 uppercase tracking-widest" id="current-date">Loading...</p>
            </div>
            <div class="text-right">
                <span class="text-2xl font-bold text-accent" id="completion-rate">0%</span>
            </div>
        </div>

        <div class="progress-container mb-8">
            <div class="progress-bar" id="main-progress"></div>
        </div>

        <div class="space-y-8" id="checklist-container">
            </div>

        <div class="border-t border-white/10 pt-8 mt-10">
            <h2 class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-4 flex items-center gap-2">
                <svg class="w-4 h-4 text-accent" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                Strategic Journaling
            </h2>
            
            <textarea id="journal-input" class="w-full h-40 bg-slate-900/50 border border-white/10 rounded-xl p-4 text-sm text-slate-300 focus:outline-none focus:border-accent/50 focus:ring-1 focus:ring-accent/50 transition-all resize-none font-mono leading-relaxed placeholder-slate-600" placeholder="1. Thành tựu hôm nay?&#10;2. Sai lầm & Bài học?&#10;3. Key Task ngày mai?"></textarea>
            
            <div class="flex justify-between items-center mt-3">
                <span class="text-[10px] text-slate-600" id="save-status">Auto-saved</span>
                <button onclick="clearData()" class="text-[10px] text-red-500/50 hover:text-red-500 transition-colors uppercase tracking-wider">Reset Day</button>
            </div>
        </div>

    </div>

    <script>
        // 1. Cấu hình Hệ thống Thói quen theo 5 Trụ cột
        const dailySystem = [
            {
                category: "I. THÂN (Physical)",
                color: "text-blue-400",
                habits: [
                    { id: 'body_1', text: 'Skincare phục hồi (Sáng/Tối)' },
                    { id: 'body_2', text: 'Ngủ trước 22:15 (7-8h)' },
                    { id: 'body_3', text: 'Gym / Vận động (PPL Split)' },
                    { id: 'body_4', text: 'Drink 2L Water' },
                    { id: 'body_5', text: 'Facial & Eye Exercises' },
                    { id: 'body_6', text: 'Posture Check-in (3 lần/ngày)' }
                ]
            },
            {
                category: "II. TRÍ (Intellectual)",
                color: "text-cyan-400",
                habits: [
                    { id: 'mind_1', text: 'Deep Work Block (90 phút)' },
                    { id: 'mind_2', text: 'English Immersion (Đọc/Nghe)' },
                    { id: 'mind_3', text: 'System II Thinking (Plan before act)' }
                ]
            },
            {
                category: "III. TÂM (Soul)",
                color: "text-indigo-400",
                habits: [
                    { id: 'soul_1', text: 'Strategic Journaling (Viết dưới)' },
                    { id: 'soul_2', text: 'Thiền định (5–10 phút)' },
                    { id: 'soul_3', text: 'Digital Detox (45p trước ngủ)' }
                ]
            },
            {
                category: "IV. TIỀN (Finance)",
                color: "text-amber-400",
                habits: [
                    { id: 'money_1', text: 'Expense Tracking 100%' },
                    { id: 'money_2', text: 'Delay Shopping (Quy tắc 24h)' }
                ]
            },
            {
                category: "V. NGHIỆP (Career)",
                color: "text-rose-400",
                habits: [
                    { id: 'career_1', text: 'LinkedIn Networking (3-5 connect)' },
                    { id: 'career_2', text: '30s Self-intro Practice' },
                    { id: 'career_3', text: 'Aroma Spa Project Logic' }
                ]
            }
        ];

        // 2. Render Checklist
        const container = document.getElementById('checklist-container');
        
        dailySystem.forEach(pillar => {
            // Tạo Header cho mỗi nhóm
            let groupHtml = `
                <div class="habit-group">
                    <h3 class="text-xs font-bold ${pillar.color} uppercase tracking-widest mb-3 border-b border-white/5 pb-1">${pillar.category}</h3>
                    <div class="space-y-2">
            `;

            // Tạo các item con
            pillar.habits.forEach(habit => {
                groupHtml += `
                    <div>
                        <input type="checkbox" id="${habit.id}" class="task-checkbox" onchange="updateProgress()">
                        <label for="${habit.id}" class="task-label">
                            <div class="check-box"><span class="check-icon">✓</span></div>
                            <span class="task-text text-sm text-slate-300 font-medium">${habit.text}</span>
                        </label>
                    </div>
                `;
            });

            groupHtml += `</div></div>`;
            container.insertAdjacentHTML('beforeend', groupHtml);
        });

        // 3. Logic LocalStorage & Date (Giữ nguyên từ bản cũ vì đã tối ưu)
        const journalInput = document.getElementById('journal-input');
        const dateDisplay = document.getElementById('current-date');
        const getToday = () => new Date().toISOString().split('T')[0];

        function loadData() {
            const today = new Date();
            dateDisplay.innerText = today.toLocaleDateString('vi-VN', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

            const savedDate = localStorage.getItem('tula_date_v2'); // Đổi key v2 để tránh conflict cũ
            const currentDay = getToday();

            if (savedDate !== currentDay) {
                localStorage.clear();
                localStorage.setItem('tula_date_v2', currentDay);
            } else {
                dailySystem.forEach(p => {
                    p.habits.forEach(h => {
                        const isChecked = localStorage.getItem(h.id) === 'true';
                        const el = document.getElementById(h.id);
                        if(el) el.checked = isChecked;
                    });
                });
                journalInput.value = localStorage.getItem('tula_journal_v2') || '';
            }
            updateProgress();
        }

        function updateProgress() {
            let total = 0;
            let checkedCount = 0;

            dailySystem.forEach(p => {
                p.habits.forEach(h => {
                    total++;
                    const el = document.getElementById(h.id);
                    if (el && el.checked) {
                        checkedCount++;
                        localStorage.setItem(h.id, 'true');
                    } else {
                        localStorage.setItem(h.id, 'false');
                    }
                });
            });

            const percent = total === 0 ? 0 : Math.round((checkedCount / total) * 100);
            document.getElementById('completion-rate').innerText = `${percent}%`;
            document.getElementById('main-progress').style.width = `${percent}%`;
        }

        journalInput.addEventListener('input', () => {
            localStorage.setItem('tula_journal_v2', journalInput.value);
            const status = document.getElementById('save-status');
            status.innerText = "Saving...";
            status.className = "text-[10px] text-accent animate-pulse";
            
            clearTimeout(window.saveTimeout);
            window.saveTimeout = setTimeout(() => {
                status.innerText = "Saved";
                status.className = "text-[10px] text-slate-600";
            }, 800);
        });

        function clearData() {
            if(confirm("Start a new day?")) {
                localStorage.clear();
                location.reload();
            }
        }

        loadData();
    </script>
</body>
</html>
